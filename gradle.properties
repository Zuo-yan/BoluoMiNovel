org.gradle.java.home=C\:/Program Files/Java/jdk-21
# file.encoding 必须为 GBK：daemon 以此编码写测试 worker 的类路径文件，
# 而 Windows java.exe 启动器按系统码页(GBK)读取；用 UTF-8 会导致中文项目路径乱码、单测 ClassNotFoundException。
# Kotlin 源码编译不受影响（Kotlin 编译器独立进程，固定 UTF-8）。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=GBK -XX:+UseParallelGC
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
